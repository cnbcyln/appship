name: workpark
description: "WorkPark"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 2.2.1+221

environment:
  sdk: ^3.6.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  http: ^1.3.0 
  cupertino_icons: ^1.0.8
  easy_localization: ^3.0.7+1
  flex_color_scheme: ^8.3.0
  google_fonts: ^6.2.1
  flutter_secure_storage: ^9.2.2
  package_info_plus: ^8.1.1
  device_info_plus: ^12.2.0
  url_launcher: ^6.3.2
  intl_phone_field: ^3.2.0
  pinput: ^5.0.0
  circular_countdown_timer: ^0.2.4
  flutter_widget_from_html: ^0.17.1
  socket_io_client: ^3.0.2
  flutter_zoom_drawer: ^3.2.0
  auto_size_text: ^3.0.0
  flutter_screenutil: ^5.9.3
  loader_overlay: ^5.0.0
  animated_bottom_navigation_bar: ^1.4.0
  cached_network_image: ^3.4.1
  toastification: ^3.0.2
  flutter_sticky_header: ^0.8.0
  flutter_rating_bar: ^4.0.1
  flutter_carousel_widget: ^3.1.0
  easy_stepper: ^0.9.1
  step_progress_indicator: ^1.0.2
  image_picker: ^1.1.2
  crop_your_image: ^2.0.0
  dotted_border: ^3.0.1
  firebase_core: ^4.2.0
  firebase_messaging: ^16.0.3
  android_id: ^0.4.0
  flutter_local_notifications: ^19.3.1
  lottie: ^3.3.1
  geolocator: ^14.0.0
  geolocator_android: ^5.0.1+1
  geolocator_apple: ^2.3.8+1
  maps_launcher: ^3.0.0+1
  flutter_map: ^8.2.1
  latlong2: ^0.9.0
  restart_app: ^1.3.2
  flutter_native_splash: ^2.4.5
  flutter_timezone: ^5.0.0
  rive: ^0.13.20
  intl_phone_number_input: ^0.7.4
  ip_country_lookup: ^1.0.3
  flutter_nfc_kit: ^3.6.0
  ndef: ^0.3.4
  confetti: ^0.8.0
  animated_text_kit: ^4.2.3
  audioplayers: ^6.5.0
  in_app_update: ^4.2.5
  intl: ^0.20.2
  # flutter_background_geolocation: ^4.16.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_native_splash:
  # Ana splash screen ayarları
  color: "#FFFFFF"
  image: lib/assets/img/workpark-icon.png
  
  # Dark mode ayarları
  color_dark: "#7365FF"
  image_dark: lib/assets/img/workpark-icon.png
  
  # Platform-spesifik renkler
  color_android: "#FFFFFF"
  color_ios: "#FFFFFF"
  color_web: "#FFFFFF"
  color_dark_android: "#7365FF"
  color_dark_ios: "#7365FF"
  color_dark_web: "#7365FF"
  
  # Android 12+ özel ayarları (Logo boyutu optimizasyonu için)
  android_12:
    image: lib/assets/img/workpark-icon.png
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"
    image_dark: lib/assets/img/workpark-icon.png
    color_dark: "#7365FF"
    icon_background_color_dark: "#7365FF"
  
  # Platform desteği
  android: true
  ios: true
  web: true
  
  # iOS spesifik ayarları
  info_plist_files:
    - 'ios/Runner/Info.plist'

flutter:
  uses-material-design: true
  assets:
    - lib/assets/font/
    - lib/assets/img/
    - lib/assets/locale/
    - lib/assets/lottie/
    - lib/assets/rive/
    - lib/assets/svg/
    - lib/assets/audio/

  fonts:
    - family: Poppins
      fonts:
        - asset: lib/assets/font/PoppinsLight.ttf
          weight: 300
        - asset: lib/assets/font/PoppinsRegular.ttf
          weight: 400
        - asset: lib/assets/font/PoppinsMedium.ttf
          weight: 500
        - asset: lib/assets/font/PoppinsSemiBold.ttf
          weight: 600
        - asset: lib/assets/font/PoppinsBold.ttf
          weight: 700
        - asset: lib/assets/font/PoppinsExtraBold.ttf
          weight: 800
        - asset: lib/assets/font/PoppinsBlack.ttf
          weight: 900
    - family: Arlon
      fonts:
        - asset: lib/assets/font/ArlonSemiBold.otf
          weight: 600
        - asset: lib/assets/font/ArlonBold.ttf
          weight: 700
